<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heimatinventur</title>
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inventur">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --card:#fffdf8; --ink:#1e2a23; --mut:#6b7369; --line:#e4ddcd;
  --acc:#2f6b4f; --acc2:#e7f0ea; --bad:#c2412a; --badbg:#fbe9e4; --warn:#c9811c; --warnbg:#fbf0dc;
  --soon:#8a7a1d; --soonbg:#f6f2d8; --ok:#2f6b4f; --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161b18; --card:#1f2622; --ink:#ecefe9; --mut:#9aa39b; --line:#2f3832;
  --acc:#6fbf92; --acc2:#233a2d; --bad:#ff7d63; --badbg:#3a221d; --warn:#f0b257; --warnbg:#3a2e1b;
  --soon:#d8c96a; --soonbg:#33301a; --ok:#6fbf92;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:baseline;justify-content:space-between;max-width:620px;margin:0 auto}
.brand{font-size:22px;font-weight:500;letter-spacing:-.3px}.brand b{font-weight:700;color:var(--acc)}
.status{font-size:13px;color:var(--mut)}
main{max-width:620px;margin:0 auto;padding:4px 14px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.tabs a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;text-decoration:none;color:var(--mut);font-size:12px;font-weight:500}
.tabs a span{font-size:20px;line-height:1}
.tabs a.on{color:var(--ink);background:var(--card)}
.tabs a.add span{background:var(--acc);color:#fff;width:34px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:700}
h2{font-size:15px;font-weight:600;margin:22px 4px 8px;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:500}
.note{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--mut);text-align:center;margin:14px 0}
.banner{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:500}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.full{width:100%}
a.btn{color:inherit;text-decoration:none}
a.back{text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5}
.scanbar{display:flex;gap:8px;margin:6px 0 4px}
.scanbar .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;margin:10px 0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chips.scroll{flex-wrap:nowrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.sub{padding-left:10px;border-left:3px solid var(--line);margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mut)}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:10px 12px}
.card.bad{border-left-color:var(--bad);background:linear-gradient(90deg,var(--badbg),var(--card) 60%)}
.card.warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warnbg),var(--card) 60%)}
.card.soon{border-left-color:var(--soon)}
.em{font-size:26px;width:34px;text-align:center;flex:none}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:500;color:var(--mut)}
.tag{font-size:11px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 6px;font-weight:600}
.loc{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{text-align:right;flex:none;display:flex;flex-direction:column;font-size:13px}
.due b{font-weight:600}
.card.bad .due b{color:var(--bad)}.card.warn .due b{color:var(--warn)}
.due small{color:var(--mut)}
/* Lager */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.boxhead{display:flex;align-items:center;gap:10px;width:100%;padding:14px;background:none;border:0;text-align:left}
.boxhead .em{font-size:24px}
.boxhead .t{flex:1;font-weight:600;font-size:17px}
.boxhead .c{font-size:13px;color:var(--mut);text-align:right}
.boxhead .c b{color:var(--bad)}
.boxbody{padding:0 10px 10px}
.subhead{font-size:13px;font-weight:600;color:var(--mut);margin:10px 4px 6px;text-transform:uppercase;letter-spacing:.4px}
.boxbody .card{border-left-width:4px}
/* Add */
.big{width:100%;display:flex;align-items:center;gap:14px;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:18px;text-align:left;margin-top:6px}
.big .i{font-size:34px}.big b{display:block;font-size:19px}.big small{opacity:.85}
.eanrow{display:flex;gap:8px;margin:10px 0}
.eanrow input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500;text-align:center;line-height:1.15}
.tile .e{font-size:28px}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:8px}
.form label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.form label:first-child{margin-top:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
.namerow{display:flex;gap:8px}.namerow .emo{width:58px;text-align:center;font-size:22px;padding:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:46px;height:42px;font-size:20px}
.stepper span{min-width:48px;text-align:center;font-weight:600;font-size:18px}
.daterow{display:flex;gap:10px;align-items:center}.daterow .inp{flex:1}
.duehint{font-size:14px;font-weight:600;color:var(--acc);white-space:nowrap}
.hint{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.hint .btn{margin-top:8px}
.eanlabel{font-size:12px;color:var(--mut);margin-bottom:8px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
.aiflag{font-size:14px;color:var(--acc);margin:0 0 10px;font-weight:500}
.amtrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.amtrow .inp{width:110px}
.btn.alert{background:var(--warnbg);border-color:var(--warn);font-weight:600}
.bon{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:6px 0}
.bon.off{opacity:.45}
.bontop{display:flex;gap:8px;align-items:center}.bontop .catsel{flex:0 0 58px;width:58px;padding:8px 2px;font-size:18px;text-overflow:clip}.bontop .inp{flex:1;padding:8px 10px}
.bontop input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.bonmeta{display:grid;grid-template-columns:58px 1fr 84px;gap:6px;margin-top:8px;align-items:center}
.bonmeta .inp{padding:8px;font-size:14px}
.bonmeta .full{grid-column:span 2}
.bondate{display:flex;gap:6px;align-items:center;grid-column:span 3}.bondate .inp{flex:1}
.bondate small{font-size:12px;color:var(--mut);white-space:nowrap}
.bonhead{display:grid;grid-template-columns:1fr 1fr 92px;gap:6px;margin:8px 0}.bonhead .inp{padding:8px;font-size:14px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}.pnav b{font-size:17px}.ib:disabled{opacity:.3}
.st2{grid-template-columns:1fr 1fr}.st2 .stat b{font-size:20px}
.vb{display:flex;align-items:stretch;gap:6px;height:150px}
.vbc{flex:1;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;min-width:0}
.vbv{font-size:11px;color:var(--mut);height:15px;white-space:nowrap}
.vbtrack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.vbb{display:block;width:72%;max-width:34px;border-radius:4px 4px 0 0;opacity:.45}
.vbc.on .vbb{opacity:1}.vbc.on .vbx{color:var(--ink);font-weight:600}
.vbx{font-size:11px;color:var(--mut);margin-top:4px;height:14px;white-space:nowrap}
.hbrow{display:grid;grid-template-columns:minmax(80px,38%) 1fr 74px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{background:var(--bg);border-radius:4px;height:10px;overflow:hidden}.hbf{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.hbv{text-align:right;font-variant-numeric:tabular-nums}
.pt{width:100%;border-collapse:collapse;font-size:13px}.pt th{text-align:left;color:var(--mut);font-weight:500;padding:6px 10px}.pt td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.pt small{color:var(--mut)}.pt .up{color:var(--bad)}.pt .down{color:var(--ok)}
.krow{border-top:1px solid var(--line);padding:10px 2px;border-left:4px solid transparent;padding-left:8px}.krow:first-child{border-top:0}
.krow.bad{border-left-color:var(--bad)}.krow.warn{border-left-color:var(--warn)}.krow.done{opacity:.5}
.kinfo{display:flex;gap:10px;align-items:center}.kinfo .em{font-size:22px;width:28px}
.kbtns{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-top:8px}.kbtns .btn{padding:9px 4px;font-size:14px}
.cook{line-height:1.5;font-size:15px}.cook h4{margin:14px 0 4px;font-size:16px}
.hhbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhbtn small{color:var(--mut);font-weight:400}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:6px 0 10px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.seg button .e{font-size:18px}.seg button small{font-size:11px}.seg button small b{color:var(--bad)}
.seg button.on{background:var(--ink);color:var(--bg)}.seg button.on small{color:var(--bg);opacity:.8}.seg button.on small b{color:inherit}
.hhlist .btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0;text-align:left}
.hhlist .btn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.sugg{display:flex;flex-direction:column;gap:4px;margin-top:6px}.sugg:empty{display:none}
.sg{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;width:100%}
.sg .em{font-size:20px;width:26px}.sg .nm b{color:var(--acc)}
.sgl{font-size:13px;color:var(--mut);padding:4px 6px}
.kgrp .kl{display:block;font-size:12px;color:var(--mut);margin:6px 0 -2px}
.chip.sg2{border-color:var(--acc);color:var(--acc);font-weight:600;background:var(--acc2)}
.ask{background:var(--warnbg);border-radius:14px;padding:10px 12px 6px;margin:14px 0 4px}.ask.done{background:var(--acc2)}
.form .ask>label{margin-top:0;color:var(--ink);font-size:15px}
.no{display:inline-block;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;font-size:13px;font-weight:700;margin-right:6px;vertical-align:1px}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pick .btn{text-align:left;display:flex;flex-direction:column;gap:2px}.pick .btn small{color:inherit;opacity:.8}
.warnline{background:var(--warnbg);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.bonrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.bonrow2 .big{margin-top:0;padding:14px;gap:10px}.bonrow2 .big .i{font-size:26px}.bonrow2 .big b{font-size:16px}.bonrow2 .big small{font-size:12px}
.bonc{border-top:1px solid var(--line);padding:4px 10px}.bonc.off{opacity:.5}
.bonc1{display:flex;gap:8px;align-items:center}.bonc1 input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.bonn{flex:1;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:6px 0;min-width:0}.bonn .em{font-size:22px;width:28px}.bonn .ed{font-size:14px;color:var(--mut)}
.bongh{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--bg)}.bongh select{flex:1;font-weight:600;padding:8px}
.bond{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 0 10px 30px}.bond .full{grid-column:span 2}.bond .inp{padding:8px;font-size:14px}
.bl{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.crow{display:flex;gap:6px;align-items:stretch}.crow .card{flex:1;min-width:0}
.ck{flex:none;width:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:17px;color:var(--mut);padding:0}
.ck.on{background:var(--acc);border-color:var(--acc);color:#fff}
#selbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;padding:0 10px 6px;display:flex;justify-content:center}
#selbar[hidden]{display:none}
.selin{max-width:600px;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selin .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:0 4px 6px}
.selin .t button{background:none;border:0;color:inherit;opacity:.8;font-size:13px}
.selbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.selbtns button{border:0;border-radius:10px;padding:10px 2px;background:rgba(127,127,127,.25);color:inherit;font-size:13px;font-weight:600}
.selbtns button.go{background:var(--acc);color:#fff}.selbtns button.bad{background:var(--bad);color:#fff}
body.selon main{padding-bottom:200px}
h2 .back{font-size:13px;padding:0 6px}
.ghead{font-size:13px;color:var(--mut);margin:6px 2px 0;display:flex;gap:6px;align-items:baseline}.ghead b{color:var(--ink)}
.gbox{border-left:3px solid var(--acc);padding-left:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}
.prow small{color:var(--mut)}
.beta{font-size:10px;font-weight:700;background:var(--warn);color:#fff;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:6px;letter-spacing:.5px}
.new{font-size:10px;font-weight:700;background:var(--acc);color:#fff;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.okline{background:var(--acc2);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 6px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a,.menu button{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);text-align:left;width:100%;font-weight:600}
.menu .e{font-size:24px;width:30px;text-align:center}.menu small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.prow2{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
.prow2:first-child{border-top:0}.prow2 .em{font-size:22px;width:28px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fgrid .full{grid-column:span 2}.fgrid .inp{padding:9px}
.stc{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 7px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}.stc.best{border-color:var(--acc);background:var(--acc2);font-weight:600}
.tabs a{position:relative}.tabs .cnt{position:absolute;top:2px;right:18%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}
.shr{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.shr:first-child{border-top:0}
.shr .ck{height:36px}.shr.done .mid{text-decoration:line-through;opacity:.5}.shr .x{border:0;background:none;color:var(--mut);font-size:16px;padding:6px}
.sgrow{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px dashed var(--line)}.sgrow:first-child{border-top:0}
.day{padding:10px 12px;border-top:1px solid var(--line)}.day:first-child{border-top:0}.day.done{opacity:.5}.day .dl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}.ev:first-child{border-top:0}.ev .em{font-size:18px;width:24px}
#live{position:fixed;inset:0;z-index:40;background:#000}#live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#live .lframe{position:absolute;left:8%;right:8%;top:34%;bottom:40%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#live .lbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#live .lhint{color:#fff;text-align:center;font-size:15px}#live .row .btn{flex:1}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 2px}
/* Orte */
.orte .item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.orte .item:first-child{border-top:0}
.orte .item .t{flex:1}
.orte .item.sub{padding-left:34px;font-size:15px}
.ib{border:0;background:var(--bg);border-radius:10px;width:36px;height:34px}
/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

<script>

/* ---------- Kategorien (Haltbarkeit in Tagen je Lagerart) ---------- */

 {id:'gemuese',n:'Gemüse',e:'🥕',k:'fridge',d:{fridge:7,freezer:240,dry:5},subs:[

  ['Salat','🥬',{fridge:5,dry:1}],['Spinat','🥬',{fridge:4}],['Brokkoli','🥦',{fridge:6}],['Blumenkohl','🥦',{fridge:7}],['Zucchini','🥒',{fridge:7}],
  ['Pilze','🍄',{fridge:4}],['Kartoffeln','🥔',{dry:30}],['Zwiebeln','🧅',{dry:30}],['Knoblauch','🧄',{dry:60}],['Lauch','🥬',{fridge:10}],

 {id:'kaese',n:'Käse',e:'🧀',k:'fridge',d:{fridge:14,freezer:120,dry:0}},

 {id:'konserven',n:'Konserven',e:'🥫',k:'dry',d:{dry:730,fridge:730,freezer:730}},
 {id:'snacks',n:'Chips & Snacks',e:'🍿',k:'dry',d:{dry:120,fridge:120,freezer:120}},
 {id:'suesses',n:'Süßes',e:'🍫',k:'dry',d:{dry:180,fridge:180,freezer:180}},

 {id:'kaffee',n:'Tee & Kaffee',e:'☕',k:'dry',d:{dry:540,fridge:540,freezer:540},h:'Teebeutel, loser Tee, Kaffeebohnen/-pulver/-pads/-kapseln, Kakaopulver'},
 {id:'getraenke',n:'Getränke',e:'🧃',k:'drinks',d:{dry:180,fridge:5,freezer:90},h:'NUR trinkfertige Flüssigkeiten in Flasche/Dose/Tetrapak: Wasser, Saft, Limo, Bier, Wein, Eistee – NICHT Teebeutel/Kaffee, NICHT Milch'},
 {id:'sonst',n:'Sonstiges',e:'📦',k:'dry',d:{dry:180,fridge:7,freezer:180}}
];
const CATMAP=Object.fromEntries(CATS.map(c=>[c.id,c]));
const CH={milch:'Milch, Joghurt, Sahne, Quark, Butter',kaese:'Käse',fleisch:'Fleisch, Wurst, Aufschnitt',tk:'tiefgekühlt gekaufte Ware (Pizza, TK-Gemüse, Eis)',fertig:'Fertiggerichte, Suppen, Dosengerichte',nudeln:'Nudeln, Reis, Mehl? nein → Backzutaten; Haferflocken, Müsli, Couscous',konserven:'Dosen/Gläser: Tomaten, Bohnen, Mais, Obstkonserven',snacks:'Chips, Nüsse, Cracker, Salzgebäck',suesses:'Schokolade, Kekse, Gummibärchen, Aufstriche wie Nutella, Marmelade',saucen:'Ketchup, Senf, Öl, Essig, Gewürze, Brühe',backen:'Mehl, Zucker, Backpulver, Hefe, Backmischungen',brot:'Brot, Brötchen, Toast, Kuchen',sonst:'Drogerie, Haushalt, alles andere'};
CATS.forEach(c=>{if(!c.h&&CH[c.id])c.h=CH[c.id];});CATMAP.nudeln.h='Nudeln, Reis, Haferflocken, Müsli, Couscous';
const CATDESC=CATS.map(c=>`${c.id} = ${c.n}${c.h?' ('+c.h+')':''}`).join('; ');
const KINDS={fridge:{n:'Kühlung',e:'🧊'},freezer:{n:'Gefrieren',e:'❄️'},dry:{n:'Trockenware',e:'📦'},drinks:{n:'Getränke',e:'🥤'},other:{n:'Sonstiges',e:'🏠'}};
const QUICK=[['+2 T',2],['+4 T',4],['+1 Wo',7],['+2 Wo',14],['+1 Mo',30],['+3 Mo',91],['+6 Mo',182],['+1 J',365],['+2 J',730]];

/* ---------- State ---------- */
const S={items:[],locs:[],itemsReady:false,locsReady:false,names:{},view:'start',filter:'all',q:'',open:{},draft:null,lastLoc:null,sheet:null,err:null,shop:[],allShop:[],shopReady:false,plans:{},pq:'',shopHide:new Set(),shopSuggL:[],sel:new Set(),groupIds:[],products:{},bon:null,bonMeta:null,purch:[],log:[],purchReady:false,logReady:false,stMode:'month',stOff:0,statsSub:false,fefo:new Set(),allLocs:[],allItems:[],allPurch:[],allLog:[],hhs:[],hh:null,hhReady:false,lagerKind:null,stAll:false};
let DB=null,USER=null,ME=null,SAMPLE=null,SAMPLE_IMG=false,CANWRITE=true,READONLY=false,scanFor='add',confirmFn=null,bonIdx=-1;
const UNITS=['g','kg','ml','l','Stk'];
const FRAC=[[1,'voll'],[0.75,'¾'],[0.5,'½'],[0.25,'¼']];

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const today=()=>ymd(new Date());
const addDays=(n,from)=>{const d=from?parseYmd(from):new Date();d.setDate(d.getDate()+n);return ymd(d);};
const daysLeft=e=>e?Math.round((parseYmd(e)-parseYmd(today()))/864e5):9999;
const fmtDate=s=>{if(!s)return'–';const d=parseYmd(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2);};
function dueLabel(e){const n=daysLeft(e);if(!e)return'ohne Datum';if(n<-1)return`seit ${-n} Tagen abgelaufen`;if(n===-1)return'seit gestern abgelaufen';if(n===0)return'heute';if(n===1)return'morgen';if(n<14)return`in ${n} Tagen`;if(n<60)return`in ${Math.round(n/7)} Wochen`;if(n<730)return`in ${Math.round(n/30.4)} Monaten`;return'in über 2 Jahren';}
const dueClass=e=>{const n=daysLeft(e);return n<0?'bad':n<=2?'warn':n<=7?'soon':'ok';};
const byExp=(a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999');
const byOrder=(a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(String(b.name),'de');
const locById=id=>S.locs.find(l=>l.id===id);
const topLocs=()=>S.locs.filter(l=>!l.parent||!locById(l.parent)).sort(byOrder);
const kids=id=>S.locs.filter(l=>l.parent===id).sort(byOrder);
const topOf=id=>{const l=locById(id);if(!l)return null;return (l.parent&&locById(l.parent))?l.parent:l.id;};
function locKind(id){const t=locById(topOf(id));return (t&&KINDS[t.kind])?t.kind:'other';}
function locPath(id){const l=locById(id);if(!l)return'Ohne Lagerort';const p=l.parent&&locById(l.parent);return p?p.name+' › '+l.name:l.name;}
const inLoc=(it,topId)=>topOf(it.loc)===topId;
function catDays(cat,sub,kind){const c=CATMAP[cat]||CATMAP.sonst;const k=(kind==='other'||kind==='drinks')?'dry':kind;const s=sub&&c.subs&&c.subs.find(x=>x[0]===sub);const sd=s?s[2]:null;
 let v=(sd&&sd[k]!=null)?sd[k]:c.d[k];if(!v)v=(sd&&Object.values(sd)[0])||c.d[c.k]||7;return v;}
function prefKind(cat,sub){const c=CATMAP[cat]||CATMAP.sonst;const s=sub&&c.subs&&c.subs.find(x=>x[0]===sub);if(s){const ks=Object.keys(s[2]);if(ks.length===1)return ks[0];if(s[2].fridge==null)return 'dry';}return c.k;}
function defaultLoc(kind){if(S.lastLoc&&locById(S.lastLoc)&&locKind(S.lastLoc)===kind)return S.lastLoc;const t=topLocs().find(l=>l.kind===kind);if(!t&&kind==='drinks')return defaultLoc('dry');return t?t.id:(S.lastLoc&&locById(S.lastLoc)?S.lastLoc:(topLocs()[0]?.id||null));}
const slugName=n=>{let x=String(n||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);return x||null;};
const sizeKey=(a,u)=>a>0?(String(Math.round(a*1000)/1000).replace('.','_')+(u||'')).toLowerCase():'';
const pkey=(n,a,u,w)=>{const k=slugName(n);if(!k)return null;const z=w?'':sizeKey(a,u);return 'n-'+k+(z?'-'+z:'');};
const ipk=i=>pkey(i.name,i.amount,i.unit,i.w);
const ikey=i=>i.ean||ipk(i);
function byName(n,a,u){const k=slugName(n);if(!k)return null;if(a>0){const p=S.products[pkey(n,a,u)];if(p)return p;}
 if(S.products['n-'+k])return S.products['n-'+k];let best=null;for(const p of Object.values(S.products)){if(p.name&&slugName(p.name)===k&&(!best||String(p.updated||'')>String(best.updated||'')))best=p;}
 if(!best)for(const p of Object.values(S.products)){if(Array.isArray(p.alias)&&p.alias.some(a=>slugName(a)===k)){best=p;break;}}return best;}
function grundNum(price,amount,unit){price=+price;amount=+amount;if(!(price>0)||!(amount>0))return null;const b=(unit==='g'||unit==='ml')?amount/1000:((unit==='kg'||unit==='l')?amount:null);return b?price/b:null;}
const lname=l=>l.name+(l.amount&&!l.w?' '+amtLabel(l.amount,l.unit):'');
const numDe=v=>Number(v).toLocaleString('de-DE',{maximumFractionDigits:2});
function amtLabel(a,u,rest){rest=rest==null?1:rest;if(!a)return rest<1?'noch '+(FRAC.find(f=>f[0]===rest)||[0,Math.round(rest*100)+'%'])[1]:'';
 if(rest<1){let v=a*rest;v=u==='g'||u==='ml'?Math.round(v/10)*10:Math.round(v*100)/100;return 'noch ~'+numDe(v)+' '+u;}return numDe(a)+' '+(u||'');}
function grund(price,amount,unit){price=+price;amount=+amount;if(!(price>0)||!(amount>0))return '';let base,u;
 if(unit==='g'){base=amount/1000;u='kg';}else if(unit==='kg'){base=amount;u='kg';}else if(unit==='ml'){base=amount/1000;u='l';}else if(unit==='l'){base=amount;u='l';}else return '';
 return (price/base).toLocaleString('de-DE',{style:'currency',currency:'EUR'})+'/'+u;}
const LBL=()=>!!(S.hhs.find(x=>x.id===S.hh)||{}).labels;
function nextNo(extra){const used=new Set(S.items.map(i=>i.no).filter(Boolean));(extra||[]).forEach(n=>used.add(n));let n=1;while(used.has(n))n++;return n;}
const idHint=i=>[LBL()&&i.no?`<b>Etikett Nr. ${i.no}</b>`:'',!i.est?`dem aufgedruckten MHD <b>${fmtDate(i.exp)}</b>`:'',i.est&&!(LBL()&&i.no)?`dem Ort (${esc(locPath(i.loc))}) – Datum nur geschätzt`:''].filter(Boolean).join(' oder ');
const noBadge=i=>LBL()&&i.no?`<span class="no">${i.no}</span>`:'';
function bigAmt(v,u){if(u==='g'&&v>=1000){v/=1000;u='kg';}else if(u==='ml'&&v>=1000){v/=1000;u='l';}v=u==='g'||u==='ml'?Math.round(v):Math.round(v*100)/100;return numDe(v)+' '+(u||'');}
const validDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const n=daysLeft(v);return n>-400&&n<3000;};
function subFor(cat,name){const c=CATMAP[cat];if(!c||!c.subs||!name)return null;const n=name.toLowerCase();const s=c.subs.find(x=>n.includes(x[0].toLowerCase().slice(0,5)));return s?s[0]:null;}
const nameOf=id=>id?(id===ME?'dir':(S.names[id]||'jemandem')):'jemandem';
let toastT;function toast(msg,ms=2600){const t=$('#toast');t.innerHTML=msg;t.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.hidden=true,ms);}
const busy=msg=>toast('<span class="spin"></span>'+esc(msg),0);
const unbusy=()=>{$('#toast').hidden=true;};
function dbErr(e){console.error(e);const c=e&&e.code;if(c==='invalid_argument'&&CANWRITE!==true){READONLY=true;renderStatus();toast('Du hast nur Leserechte für diese Inventur.');}
 else if(c==='quota_exceeded')toast('Speicher voll – bitte alte Einträge löschen.',4000);
 else if(c==='resource_exhausted')toast('Zu viele Aktionen auf einmal – kurz warten.');
 else toast('Speichern hat nicht geklappt – bitte nochmal.');}
async function write(fn){if(!DB){toast('Keine Verbindung zur Datenbank.');return false;}if(READONLY){toast('Nur Leserechte.');return false;}try{await fn();return true;}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn();return true;}catch(e2){dbErr(e2);return false;}}dbErr(e);return false;}}

/* ---------- Rendering ---------- */
function renderStatus(){updShopCnt();const st=$('#status');let t='';if(!DB&&S.err)t='offline';else if(!S.itemsReady)t='lädt…';else t=S.items.length+' Art.';if(READONLY)t+=' · nur lesen';const h=S.hhs.find(x=>x.id===S.hh);st.innerHTML=(h?'🏠 '+esc(h.name)+' ▾ ':(S.hhReady?'🏠 Haushalt anlegen ':''))+'<small>'+esc(t)+'</small>';}
function route(){setTimeout(renderSelBar,0);const h=(location.hash||'').slice(1)||'start';S.view=['start','lager','neu','orte','stat','kontrolle','einkauf','mehr','produkte','plan','verlauf'].includes(h)?h:'start';const tab=S.view==='kontrolle'?'lager':(['stat','orte','produkte','plan','verlauf'].includes(S.view)?'mehr':S.view);document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));render();window.scrollTo(0,0);}
function render(){renderStatus();setTimeout(renderSelBar,0);const v=$('#view');
 if(S.err&&!DB){v.innerHTML=`<div class="note">${esc(S.err)}</div>`;return;}
 v.innerHTML=({start:viewStart,lager:viewLager,neu:viewNeu,orte:viewOrte,stat:viewStat,kontrolle:viewKontrolle,einkauf:viewEinkauf,mehr:viewMehr,produkte:viewProdukte,plan:viewPlan,verlauf:viewVerlauf})[S.view]();}
function renderData(){renderStatus();setTimeout(renderSelBar,0);
 if(S.view==='einkauf'&&$('#shoplist')){$('#shoplist').innerHTML=shopListHtml();return;}
 if(S.view==='produkte'&&$('#plist')){$('#plist').innerHTML=prodRows();return;}
 if(S.view==='start'&&$('#list')){$('#list').innerHTML=listHtml();$('#stats').innerHTML=statsHtml();$('#kchips').innerHTML=chipsHtml();return;}
 if(S.view==='neu'&&(S.draft||S.bon))return; // Formular nicht zerstören
 render();}
function renderKeep(){const a=document.activeElement;const f=a&&a.dataset&&a.dataset.f;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}render();
 if(f){const n=document.querySelector(`[data-f="${f}"]`);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se);}catch(e){}}}}
const loading=()=>`<div class="note"><span class="spin"></span>Bestand wird geladen…</div>`;

function card(i,alt){return `<button class="card ${dueClass(i.exp)}" data-act="item" data-id="${esc(i.id)}">
 <span class="em">${esc(i.emoji||CATMAP[i.cat]?.e||'📦')}</span>
 <span class="mid"><span class="nm">${noBadge(i)}${typeof alt==='string'?alt:esc(i.name)+(()=>{const a=[i.qty>1?'×'+i.qty:'',amtLabel(i.amount,i.unit,i.rest)].filter(Boolean).join(' · ');return a?` <small>${esc(a)}</small>`:'';})()}${i.opened?' <span class="tag">offen</span>':''}${S.fefo.has(i.id)?' <span class="tag">zuerst</span>':''}</span><span class="loc">${esc(locPath(i.loc))}${grund(i.price,i.amount,i.unit)?' · '+grund(i.price,i.amount,i.unit):''}</span></span>
 <span class="due"><b>${i.est&&daysLeft(i.exp)>=0?'≈ ':''}${dueLabel(i.exp)}</b><small>${i.est?'geschätzt':fmtDate(i.exp)}</small></span></button>`;}

function filtered(){let it=S.items.slice();if(S.filter!=='all')it=it.filter(i=>locKind(i.loc)===S.filter);
 if(S.q){const q=S.q.toLowerCase();const qn=q.replace('#','').trim();it=it.filter(i=>(qn&&String(i.no)===qn)||(i.name||'').toLowerCase().includes(q)||locPath(i.loc).toLowerCase().includes(q)||(CATMAP[i.cat]?.n||'').toLowerCase().includes(q));}
 return it.sort(byExp);}
function statsHtml(){const it=S.items;const bad=it.filter(i=>daysLeft(i.exp)<0).length,warn=it.filter(i=>{const n=daysLeft(i.exp);return n>=0&&n<=2;}).length,week=it.filter(i=>{const n=daysLeft(i.exp);return n>2&&n<=7;}).length;
 return `<div class="stat bad"><b>${bad}</b><span>abgelaufen</span></div><div class="stat warn"><b>${warn}</b><span>bis übermorgen</span></div><div class="stat"><b>${week}</b><span>diese Woche</span></div>`;}
function listHtml(){if(!S.itemsReady)return loading();const it=filtered();
 if(!S.items.length)return `<div class="note">Noch nichts eingeräumt.<br><br><a class="btn primary" href="#neu" style="text-decoration:none;display:inline-block">＋ Erstes Produkt einräumen</a></div>`;
 if(!it.length)return `<div class="note">Nichts gefunden.</div>`;

const norm=t=>String(t||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();

function localSugg(q){const sp=splitStore(q);const nq=sp.rest,qt=nq.split(' ').filter(Boolean);if(!qt.length)return[];const seen=new Set(),out=[];
 const consider=c=>{const k0=slugName(c.name);const k=k0&&(k0+'|'+(c.amount||'')+(c.unit||''));if(!k||seen.has(k))return;const n=norm(c.name),w=n.split(' ');
  if(!qt.every(t=>w.some(x=>x.startsWith(t))||(t.length>=3&&n.includes(t))))return;seen.add(k);
  c.score=(n.startsWith(nq)?100:0)+(c.src==='prod'?40:0)+(w[0].startsWith(qt[0])?20:0)+(sp.store&&c.store&&norm(c.store)===norm(sp.store)?80:0)-n.length/10;out.push(c);};
 Object.values(S.products).filter(p=>p.name).sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||''))).forEach(p=>consider({src:'prod',name:p.name,emoji:p.emoji,cat:p.cat,amount:p.amount,unit:p.unit,brand:p.brand,store:p.store,product:p}));
 CATS.forEach(c=>(c.subs||[]).forEach(sb=>consider({src:'gen',name:sb[0],emoji:sb[1],cat:c.id,sub:sb[0]})));

 const loc=localSugg(q),key=norm(q),ai=AIS[key];const sk=x=>slugName(x.name)+'|'+(x.amount||'')+(x.unit||'');const fk=x=>slugName(x.src==='ai'&&x.amount&&!/\d/.test(x.name)?x.name+' '+amtLabel(x.amount,x.unit):x.name);

 S.suggList=list;S.suggQ=q;if(wantAi&&ai===undefined){clearTimeout(aiT);aiT=setTimeout(()=>aiSugg(q),450);}}
async function aiSugg(q){const key=norm(q);if(!SAMPLE||AIS[key]!==undefined||!S.draft||norm(S.draft.name)!==key)return;AIS[key]=null;

 try{let v;if(typeof SAMPLE.json==='function')v=await SAMPLE.json(prompt,{modelTier:'quick'});else{const r=await SAMPLE(prompt,{modelTier:'quick'});const m=String(r.text||'').match(/\{[\s\S]*\}/);v=m?JSON.parse(m[0]):null;}
  AIS[key]=(v&&Array.isArray(v.s)?v.s:[]).slice(0,8).map(x=>({src:'ai',name:String(x.name||'').trim().slice(0,60),brand:x.brand?String(x.brand).slice(0,30):null,store:x.store?String(x.store).slice(0,30):(sp.store||null),cat:CATMAP[x.cat]?x.cat:'sonst',emoji:String(x.emoji||'').slice(0,4),amount:+x.amount>0?+x.amount:null,unit:UNITS.includes(x.unit)?x.unit:null,days:+x.days>0?Math.round(+x.days):null})).filter(x=>x.name);}
 catch(e){AIS[key]=[];if(e&&e.code==='not_granted'){SAMPLE=null;SAMPLE_IMG=false;}else if(e&&e.code==='rate_limited'){delete AIS[key];}}

const eur=v=>(+v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return[y,Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)];}
function periodRange(mode,off){const now=new Date();let s,e,label,short;
 if(mode==='week'){s=new Date(now.getFullYear(),now.getMonth(),now.getDate());s.setDate(s.getDate()-((s.getDay()+6)%7)+7*off);e=new Date(s);e.setDate(e.getDate()+7);const w=isoWeek(s);const l=new Date(e);l.setDate(l.getDate()-1);label=`KW ${w[1]} · ${fmtDate(ymd(s))} – ${fmtDate(ymd(l))}`;short='KW'+w[1];}
 else if(mode==='month'){s=new Date(now.getFullYear(),now.getMonth()+off,1);e=new Date(s.getFullYear(),s.getMonth()+1,1);label=s.toLocaleDateString('de-DE',{month:'long',year:'numeric'});short=s.toLocaleDateString('de-DE',{month:'short'}).replace('.','');}
 else{s=new Date(now.getFullYear()+off,0,1);e=new Date(s.getFullYear()+1,0,1);label=String(s.getFullYear());short=label;}
 return{s:ymd(s),e:ymd(e),label,short};}
const inR=(d,r)=>!!d&&d>=r.s&&d<r.e;
const logDay=l=>l.at?ymd(new Date(l.at)):null;
const pTotal=p=>p.total>0?+p.total:(p.lines||[]).reduce((a,l)=>a+(+l.price||0),0);
function agg(r){const P=S.purch.filter(p=>inR(p.date,r)),L=S.log.filter(l=>inR(logDay(l),r));const used=L.filter(l=>l.action==='used'),tr=L.filter(l=>l.action==='trash');
 const sum=(a,f)=>a.reduce((x,y)=>x+(+f(y)||0),0);let kg=0,lt=0;tr.forEach(x=>{if(!x.amount)return;if(x.unit==='g')kg+=x.amount/1000;else if(x.unit==='kg')kg+=+x.amount;else if(x.unit==='ml')lt+=x.amount/1000;else if(x.unit==='l')lt+=+x.amount;});
 return{P,used,tr,spend:sum(P,pTotal),usedN:sum(used,x=>x.units??x.qty),trN:sum(tr,x=>x.units??x.qty),usedV:sum(used,x=>x.val),trV:sum(tr,x=>x.val),kg,lt};}
function groupSum(arr,key,val){const m={};arr.forEach(x=>{const k=key(x);if(k==null||k==='')return;m[k]=(m[k]||0)+(+val(x)||0);});return Object.entries(m).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);}
function hbars(rows,fmt,labelFn){if(!rows.length)return '<div class="loc" style="padding:6px 0">Keine Daten in diesem Zeitraum.</div>';const max=rows[0][1]||1;

function pricePts(){const m={};S.purch.forEach(p=>(p.lines||[]).forEach(l=>{if(!(+l.price>0))return;const k=pkey(l.name,l.amount,l.unit,l.w);if(!k)return;const u=l.w?grundNum(l.price,l.amount,l.unit):l.price/(l.qty||1);if(!(u>0))return;

function priceTable(){const rows=pricePts().filter(x=>x.pts.length>=2).map(x=>{x.pts.sort((a,b)=>a.d.localeCompare(b.d));const last=x.pts[x.pts.length-1],prev=x.pts[x.pts.length-2];x.last=last;x.chg=prev.u?(last.u-prev.u)/prev.u*100:0;x.min=Math.min(...x.pts.map(q=>q.u));x.max=Math.max(...x.pts.map(q=>q.u));x.minStore=(x.pts.find(q=>q.u===x.min)||{}).store||'';return x;}).sort((a,b)=>b.pts.length-a.pts.length).slice(0,12);
 if(!rows.length)return '<div class="loc" style="padding:8px 12px;white-space:normal">Erscheint, sobald ein Produkt (gleiche Größe) auf mindestens zwei Bons vorkommt.</div>';

function qtyAgg(lines){let kg=0,lt=0,pk=0;const by={};lines.forEach(l=>{const q=l.w?1:(l.qty||1);let k=0,L=0;if(l.amount>0){const t=l.amount*q;if(l.unit==='g')k=t/1000;else if(l.unit==='kg')k=t;else if(l.unit==='ml')L=t/1000;else if(l.unit==='l')L=t;}

async function logAct(i,action,qty){const rest=i.rest??1;const units=action==='trash'?Math.max(0,qty-1+rest):qty;
 const val=i.price?Math.round(i.price*units*100)/100:null;const amt=i.amount?Math.round(i.amount*units*100)/100:null;
 await write(async()=>{await DB.collection('log').add({hh:i.hh||S.hh,name:i.name,cat:i.cat||null,ean:i.ean||null,action,qty,units:Math.round(units*100)/100,val,amount:amt,unit:i.unit||null,dl:daysLeft(i.exp),kind:locKind(i.loc),at:new Date().toISOString(),by:ME||null,it:{loc:i.loc||null,exp:i.exp||null,est:!!i.est,price:i.price??null,emoji:i.emoji||null,sub:i.sub||null,brand:i.brand||null,store:i.store||null,pid:i.pid||null,amount:i.amount||null,unit:i.unit||null,w:!!i.w,opened:!!i.opened,rest:i.rest??1,added:i.added||null,by:i.by||null}});});}
async function unbook(i,qty){if(!i.pid||!DB)return;let snap;try{snap=await DB.doc('purchases/'+i.pid).get();}catch(e){return;}if(!snap.exists)return;const p=snap.data();
 const lines=(p.lines||[]).map(l=>({...l}));let k=lines.findIndex(l=>pkey(l.name,l.amount,l.unit,l.w)===ipk(i));if(k<0)k=lines.findIndex(l=>slugName(l.name)===slugName(i.name));let minus=(+i.price||0)*qty;
 if(k>=0){const l=lines[k];const per=l.qty?(+l.price||0)/l.qty:(+i.price||0);minus=per*Math.min(qty,l.qty||qty);l.qty=Math.max(0,(l.qty||1)-qty);l.price=Math.max(0,Math.round(((+l.price||0)-minus)*100)/100);if(l.qty===0)lines.splice(k,1);}
 const total=Math.max(0,Math.round(((+p.total||0)-minus)*100)/100);await write(()=>DB.doc('purchases/'+i.pid).update({lines,total}));}
async function consume(i,qty,action){qty=Math.min(qty,i.qty||1);const left=(i.qty||1)-qty;
 const ok=await write(async()=>{if(left>0)await DB.doc('items/'+i.id).update({qty:left});else await DB.doc('items/'+i.id).delete();});
 if(!ok)return;closeSheet();
 if(action==='remove'){await unbook(i,qty);toast('↩️ Fehlbuchung entfernt'+(i.pid?' – Betrag aus den Ausgaben genommen':'')+(left>0?` (noch ${left} im Bestand)`:''));}
 else toast(action==='trash'?'🗑️ '+qty+'× als weggeworfen gebucht'+(left>0?` – noch ${left}`:''):'✅ '+esc(i.name)+(left>0?` – noch ${left}`:' verbraucht'));
 logAct(i,action,qty);}

let ZXP=null,ZXR=null;
function loadZXing(){if(ZXP)return ZXP;ZXP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/zxing.min.js';s.onload=()=>{const Z=window.ZXing;const h=new Map();h.set(Z.DecodeHintType.TRY_HARDER,true);
 h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.DATA_MATRIX]);
 ZXR=new Z.MultiFormatReader();ZXR.setHints(h);res();};s.onerror=()=>{ZXP=null;rej(new Error('zxing'));};document.head.appendChild(s);});return ZXP;}
async function loadImage(file){if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){try{return await createImageBitmap(file);}catch(e2){}}}
 return await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file);});}
function toCanvas(img,max,crop){const W=img.width,H=img.height;let sx=0,sy=0,sw=W,sh=H;if(crop){sw=W*crop;sh=H*crop;sx=(W-sw)/2;sy=(H-sh)/2;}
 const sc=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);c.getContext('2d',{willReadFrequently:true}).drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c;}
function lum(c){const w=c.width,h=c.height,d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;const L=new Uint8ClampedArray(w*h);for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;return{L,w,h};}
function rot({L,w,h}){const R=new Uint8ClampedArray(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)R[x*h+(h-1-y)]=L[y*w+x];return{L:R,w:h,h:w};}
function zx({L,w,h}){const Z=window.ZXing;for(const B of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){try{return ZXR.decode(new Z.BinaryBitmap(new B(new Z.RGBLuminanceSource(L,w,h)))).getText();}catch(e){}finally{try{ZXR.reset();}catch(e){}}}return null;}
async function decodeFile(file){const img=await loadImage(file);
 if('BarcodeDetector' in window){try{const want=['ean_13','ean_8','upc_a','upc_e','code_128','qr_code','data_matrix'];const sup=await BarcodeDetector.getSupportedFormats();const f=want.filter(x=>sup.includes(x));
  if(f.length){const r=await new BarcodeDetector({formats:f}).detect(img);if(r&&r.length)return r[0].rawValue;}}catch(e){}}
 await loadZXing();
 const tries=[[1400],[900],[2000,0.6],[1200,0.5],[2400]];
 for(const[m,cr]of tries){const l=lum(toCanvas(img,m,cr));const t=zx(l)||zx(rot(l));if(t)return t;await new Promise(r=>setTimeout(r,0));}
 return null;}
function gs1Date(s){const y=2000+ +s.slice(0,2),m=+s.slice(2,4);let d=+s.slice(4,6);if(m<1||m>12)return null;if(!d)d=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(d);}
function normEan(e){if(!e)return null;e=String(e);if(e.length===14&&e[0]==='0')e=e.slice(1);if(e.length===12)e='0'+e;return /^\d{8,14}$/.test(e)?e:null;}
function parseCode(t){t=String(t||'').trim();let ean=null,exp=null;
 const dl=t.match(/\/01\/(\d{8,14})/);if(dl){ean=dl[1];const x=t.match(/\/(?:17|15)\/(\d{6})/);if(x)exp=gs1Date(x[1]);}
 else if(/^\d{8,14}$/.test(t))ean=t;
 else{let s=t.replace(/^\]..?/,'');if(s.includes('(')){s=s.replace(/\((\d{2,4})\)/g,'\x1d$1').replace(/^\x1d/,'');}
  const FIX={'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6};let i=0,guard=0;
  while(i<s.length&&guard++<20){if(s[i]==='\x1d'){i++;continue;}const ai=s.slice(i,i+2);if(FIX[ai]){const v=s.slice(i+2,i+2+FIX[ai]);if(ai==='01'||ai==='02')ean=v;if(ai==='17'||(ai==='15'&&!exp))exp=gs1Date(v);i+=2+FIX[ai];}
   else{const j=s.indexOf('\x1d',i);if(j<0)break;i=j+1;}}
  if(ean&&!/^\d{14}$/.test(ean))ean=null;}
 return{ean:normEan(ean),exp,raw:t};}

let PDFP=null;
function loadPdf(){if(PDFP)return PDFP;PDFP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='lib/pdf.min.js';
 sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';res(window.pdfjsLib);}catch(e){rej(e);}};sc.onerror=()=>{PDFP=null;rej(new Error('pdf'));};document.head.appendChild(sc);});return PDFP;}
async function pdfRead(file){const lib=await loadPdf();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
 for(let pn=1;pn<=Math.min(doc.numPages,8);pn++){const pg=await doc.getPage(pn);const tc=await pg.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<=2.5);if(!r){r={y,items:[]};rows.push(r);}r.items.push(it);});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()));}
 const text=out.filter(Boolean).join('\n');if(text.length>=40)return{text};
 // gescanntes PDF ohne Text: erste Seite als Bild
 const pg=await doc.getPage(1);const vp=pg.getViewport({scale:2.2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return{blob:await new Promise(r=>c.toBlob(r,'image/jpeg',0.9))};}
async function handlePicked(file){if(!file)return;const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||'');
 if(!isPdf)return aiBon(file);
 busy('eBon wird geöffnet…');let r;try{r=await pdfRead(file);}catch(e){console.error(e);unbusy();toast('PDF konnte nicht gelesen werden – alternativ Screenshot vom Bon wählen.',4000);return;}
 unbusy();if(r.text)return aiBon(null,r.text);return aiBon(r.blob);}

 ov.innerHTML=`<video playsinline muted autoplay></video><div class="lframe"></div><div class="lbar"><div class="lhint">Strichcode in den Rahmen halten</div><div class="row"><button class="btn" data-act="scanPhoto">📷 Foto statt Live</button><button class="btn primary" data-act="scanStop">Schließen</button></div></div>`;

 try{LIVE.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
 catch(e){stopLive();toast('Kamera nicht erlaubt – nutze das Foto.',3000);const inp=$('#cam');inp.value='';inp.click();return;}
 if(!LIVE)return;video.srcObject=LIVE.stream;try{await video.play();}catch(e){}
 try{const tr=LIVE.stream.getVideoTracks()[0];const cap=tr.getCapabilities?tr.getCapabilities():{};if(cap.focusMode&&cap.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
 let det=null;if('BarcodeDetector' in window){try{const want=['ean_13','ean_8','upc_a','upc_e','code_128','qr_code','data_matrix'];const sup=await BarcodeDetector.getSupportedFormats();const f=want.filter(x=>sup.includes(x));if(f.length)det=new BarcodeDetector({formats:f});}catch(e){}}
 if(!det){try{await loadZXing();}catch(e){}}
 const cv=document.createElement('canvas');const tick=async()=>{if(!LIVE||LIVE.done)return;if(LIVE.busy||video.readyState<2){LIVE.timer=setTimeout(tick,120);return;}LIVE.busy=true;let code=null;

async function aiBon(file,text){if(!SAMPLE||(!file&&!text)||(file&&!SAMPLE_IMG))return;busy('Kassenbon wird gelesen…');
 const kn=[...new Set(Object.values(S.products).filter(x=>x.name).sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||''))).map(x=>x.name+(x.amount?' ('+amtLabel(x.amount,x.unit)+')':'')))].slice(0,200);const al=Object.values(S.products).filter(x=>Array.isArray(x.alias)&&x.alias.length).slice(0,60).map(x=>x.alias.map(a=>'„'+a+'“').join('/')+' = „'+x.name+'“');
 try{const P=`${text?'Text eines digitalen deutschen Kassenbons (eBon-PDF).':'Foto eines deutschen Kassenbons.'} Erfasse JEDE Artikelzeile sauber als Datensatz für eine Haushalts-Inventur mit Preis- und Mengenstatistik.
Regeln:
1. name = Marke + Produkt + Sorte, Kassenkürzel ausgeschrieben, OHNE Packungsgröße/Menge (z. B. „Nutella“, „Gut & Günstig Speisemöhren“, „De Cecco Linguine“). Max. 40 Zeichen.
2. qty = Anzahl gekaufter Packungen (Zeilen wie „2 x 1,29“ oder „3 Stk“ → 2 bzw. 3). Gleiche Artikel aus mehreren Zeilen zusammenfassen.
3. amount + unit = Inhalt EINER Packung (450 g, 1 l, 20 Stk Teebeutel, 10 Stk Eier). Steht er nicht auf dem Bon, nimm die übliche Größe genau dieses Produkts und setze amountGuess=true; null nur, wenn wirklich unbestimmbar.
4. Multipacks einzeln verbrauchbarer Teile (Sixpack Wasser 6×1,5 l, 4er-Joghurt, Kasten Bier): qty = Anzahl Einzelteile insgesamt, amount = Inhalt pro Einzelteil.

6. price = tatsächlich bezahlter Betrag der Zeile für alle Packungen zusammen. Rabatt-, Aktions- und Coupon-Zeilen, die zu einem Artikel gehören, von diesem abziehen.

Antworte NUR mit JSON:
{"chain": Text oder null, "market": Text oder null, "date": "YYYY-MM-DD" oder null, "total": zu zahlende Endsumme oder null, "deposit": Zahl (0 wenn kein Pfand), "items":[{"name": Text, "brand": Marke/Eigenmarke oder null, "cat": genau eine dieser IDs: ${CATDESC}, "emoji": ein Emoji, "qty": Ganzzahl, "amount": Zahl oder null, "unit": "g"|"kg"|"ml"|"l"|"Stk" oder null, "amountGuess": true|false, "weighed": true|false, "price": Zahl oder null, "days": Zahl oder null}]}
Erfinde nichts.${text?'\n\nBON-TEXT:\n'+text.slice(0,15000):''}`;
  let v;if(text){if(typeof SAMPLE.json==='function')v=await SAMPLE.json(P,{modelTier:'default'});else{const r=await SAMPLE(P,{modelTier:'default'});const m=String(r.text||'').match(/\{[\s\S]*\}/);v=m?JSON.parse(m[0]):null;}}else v=await aiJson(P,file,1800);
  unbusy();bonApply(v);
 }catch(e){unbusy();aiErr(e);}}

function updShopCnt(){const c=$('#shopcnt');if(!c)return;const n=S.shop.filter(x=>!x.done).length;c.hidden=!n;c.textContent=n;}
function shopSugg(){const st=stockMap();const on=new Set(S.shop.filter(x=>!x.done).map(x=>slugName(x.name)));const out=[];const seen=new Set();
 prodList().forEach(({k,p})=>{const mn=p.min&&+p.min[S.hh];if(!(mn>0))return;const have=st[k]||0;const nm=pname(p);if(have<mn&&!on.has(slugName(nm))&&!S.shopHide.has(k)){out.push({k,name:nm,emoji:p.emoji,cat:p.cat,why:`Mindestbestand: ${have} von ${mn} da`,qty:mn-have});seen.add(slugName(p.name));}});
 const since=addDays(-14);const inStock=new Set(S.items.map(i=>slugName(i.name)));
 S.allLog.filter(l=>hhOf(l)===S.hh&&(l.action==='used'||l.action==='trash')&&logDay(l)>=since).sort((a,b)=>String(b.at).localeCompare(String(a.at))).forEach(l=>{const sn=slugName(l.name);if(!sn||seen.has(sn)||inStock.has(sn))return;const it=l.it||{};const nm=l.name+(it.amount&&!it.w?' '+amtLabel(it.amount,it.unit):'');const k=pkey(l.name,it.amount,it.unit,it.w);
  if(on.has(slugName(nm))||on.has(sn)||S.shopHide.has(k))return;seen.add(sn);out.push({k,name:nm,emoji:it.emoji||CATMAP[l.cat]?.e,cat:l.cat,why:'aufgebraucht am '+fmtDate(logDay(l)),qty:1});});
 return out.slice(0,12);}
function shopListHtml(){updShopCnt();const open=S.shop.filter(x=>!x.done),done=S.shop.filter(x=>x.done);const sg=S.logReady?shopSugg():[];S.shopSuggL=sg;let est=0,estN=0;
 const row=x=>{const p=(x.pk&&S.products[x.pk])||byName(x.name);const c=cheapest(p);if(c&&!x.done&&!(p&&p.w)){est+=c.p*(x.qty||1);estN++;}
  return `<div class="shr ${x.done?'done':''}"><button class="ck ${x.done?'on':''}" data-act="shopDone" data-id="${esc(x.id)}">${x.done?'✓':''}</button><span class="em">${esc(x.emoji||CATMAP[x.cat]?.e||'🛒')}</span><span class="mid"><span class="nm">${esc(x.name)}${x.qty>1?` <small>×${x.qty}</small>`:''}</span>${c?`<span class="loc">zuletzt ${eur(c.p)}${p.w?'/kg':''} bei ${esc(c.s)}</span>`:''}</span><button class="x" data-act="shopDel" data-id="${esc(x.id)}">✕</button></div>`;};
 let h='';
 if(sg.length)h+=`<h2>Vorschläge<small>antippen = auf die Liste</small></h2><div class="box">${sg.map((x,i)=>`<div class="sgrow"><button class="ib" data-act="shopAddS" data-i="${i}">＋</button><span class="mid"><span class="nm">${esc(x.emoji||'')} ${esc(x.name)}${x.qty>1?` <small>×${x.qty}</small>`:''}</span><span class="loc">${esc(x.why)}</span></span><button class="x" data-act="shopHide" data-i="${i}" style="border:0;background:none;color:var(--mut)">✕</button></div>`).join('')}</div>`;
 if(!open.length&&!done.length)h+=`<div class="note">Die Liste ist leer.${sg.length?'':' Setze bei Produkten einen Mindestbestand – dann schlägt die App automatisch vor, was fehlt.'}</div>`;
 if(open.length){const cats=CATS.map(c=>c.id);const g={};open.forEach(x=>{const c=CATMAP[x.cat]?x.cat:'sonst';(g[c]=g[c]||[]).push(x);});
  const rowsH=Object.keys(g).sort((a,b)=>cats.indexOf(a)-cats.indexOf(b)).map(c=>`<div class="subhead" style="margin:8px 10px 2px">${CATMAP[c].e} ${esc(CATMAP[c].n)}</div>${g[c].map(row).join('')}`).join('');
  h+=`<h2>Zu kaufen<small>${open.length}${estN?' · ≈ '+eur(est):''}</small></h2><div class="box">${rowsH}</div>`;}
 if(done.length)h+=`<h2>Erledigt<small><button class="back" data-act="shopClear">${done.length} entfernen</button></small></h2><div class="box">${done.map(row).join('')}</div>`;
 if(open.length)h+=`<button class="btn full" data-act="shopCopy" style="margin-top:10px">📋 Liste kopieren (z. B. für WhatsApp)</button>`;
 return h;}
function viewEinkauf(){ensureStats();if(!S.shopReady||!S.hhReady)return loading();
 return `<h2 style="margin-top:6px">🛒 Einkaufsliste<small>${esc(S.hhs.find(x=>x.id===S.hh)?.name||'')}</small></h2>
 <form class="eanrow" data-form="shop"><input name="t" list="shopdl" placeholder="z. B. 2 Milch" autocomplete="off"><datalist id="shopdl">${prodList().slice(0,200).map(({p})=>`<option value="${esc(pname(p))}">`).join('')}</datalist><button class="btn primary">＋</button></form>
 <div id="shoplist">${shopListHtml()}</div>`;}
async function shopAdd(name,qty,extra){name=String(name||'').trim();if(!name)return false;const ex=S.shop.find(x=>!x.done&&slugName(x.name)===slugName(name));
 if(ex)return write(()=>DB.doc('shopping/'+ex.id).update({qty:(ex.qty||1)+(qty||1)}));
 const p=(extra&&extra.k&&S.products[extra.k])||byName(name)||prodList().map(x=>x.p).find(p=>slugName(pname(p))===slugName(name))||null;
 return write(()=>DB.collection('shopping').add({hh:S.hh,name,qty:qty||1,cat:(extra&&extra.cat)||(p&&p.cat)||'sonst',emoji:(extra&&extra.emoji)||(p&&p.emoji)||null,pk:(extra&&extra.k)||(p?pkey(p.name,p.amount,p.unit,p.w):null),done:false,added:new Date().toISOString(),by:ME||null}));}

/* ----- Einfrieren / Auftauen ----- */
function freezeBtn(i){const k=locKind(i.loc);const has=x=>topLocs().some(t=>t.kind===x);
 if(k!=='freezer'&&has('freezer'))return `<button class="btn" data-act="sFreeze" data-m="freeze">❄️ Einfrieren</button>`;
 if(k==='freezer'&&has('fridge'))return `<button class="btn" data-act="sFreeze" data-m="thaw">🌡️ Auftauen</button>`;return '';}
const thawDays=c=>(c==='fleisch'||c==='fisch')?1:c==='brot'?3:2;
function kindPicker(kind,sel){const tops=topLocs().filter(t=>t.kind===kind);const st=topOf(sel);
 return `<div class="chips">${tops.map(t=>`<button type="button" class="chip ${t.id===st?'on':''}" data-act="pickLoc" data-k="sheet" data-id="${esc(t.id)}">${esc(t.name)}</button>`).join('')}</div>`+(st&&kids(st).length?`<div class="chips sub">${kids(st).map(k=>`<button type="button" class="chip ${k.id===sel?'on':''}" data-act="pickLoc" data-k="sheet" data-id="${esc(k.id)}">${esc(k.name)}</button>`).join('')}</div>`:'');}
async function freezeSave(s){const i=S.items.find(x=>x.id===s.id);if(!i)return closeSheet();if(!locById(s.loc)){toast('Bitte Ort wählen');return;}const n=Math.min(i.qty||1,Math.max(1,s.n||i.qty||1));
 const patch=s.mode==='freeze'?{loc:s.loc,exp:addDays(catDays(i.cat,i.sub,'freezer')),est:true,frozen:today(),thawed:null,expBefore:i.exp||null}:{loc:s.loc,exp:addDays(thawDays(i.cat)),est:true,thawed:today(),frozen:null};
 let ok;if(n<(i.qty||1)){const {id:_x,...rest}=i;ok=await write(()=>DB.doc('items/'+i.id).update({qty:(i.qty||1)-n}));if(ok)ok=await write(()=>DB.collection('items').add({...rest,...patch,qty:n,no:nextNo()}));}
 else ok=await write(()=>DB.doc('items/'+i.id).update(patch));
 if(ok){closeSheet();toast((s.mode==='freeze'?'❄️ Eingefroren':'🌡️ Aufgetaut')+` → ${esc(locPath(s.loc))} · neues Datum ≈ ${fmtDate(patch.exp)}`,4000);}}

/* ----- Wochenplan ----- */
function viewPlan(){const pl=S.plans[S.hh];const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
 let h=`<a class="back" href="#mehr">‹ Mehr</a><h2>🍳 Wochenplan<small>${esc(S.hhs.find(x=>x.id===S.hh)?.name||'')}</small></h2>
 <div class="hint">Die KI plant Gerichte aus eurem Bestand – was zuerst abläuft, kommt zuerst dran. Fehlende Zutaten gehen mit einem Tipp auf die Einkaufsliste.</div>
 ${SAMPLE?`<div class="row"><button class="btn primary" data-act="planMake" data-n="5" style="flex:1">✨ 5 Tage planen</button><button class="btn" data-act="planMake" data-n="7">7 Tage</button></div>`:`<button class="btn primary full" data-act="claudeCopy">📋 Bestand kopieren → bei Claude einfügen</button><p class="loc" style="white-space:normal;margin:6px 4px">Kopiert deinen Bestand mit Ablaufdaten und eine fertige Frage. Im Chat mit Claude einfügen – du bekommst einen Wochenplan, der zuerst verbraucht, was bald abläuft.</p>`}`;
 if(pl&&Array.isArray(pl.days)&&pl.days.length){h+=`<h2>Plan vom ${fmtDate(String(pl.made||'').slice(0,10))}</h2><div class="box">${pl.days.map((d,i)=>{const dt=parseYmd(d.date||today());const miss=(d.missing||[]).filter(Boolean);
   return `<div class="day ${d.done?'done':''}"><div class="row" style="justify-content:space-between"><span class="dl">${WD[dt.getDay()]} ${fmtDate(d.date)}</span><button class="back" data-act="planDone" data-i="${i}" style="padding:0">${d.done?'↩︎ doch nicht':'✓ gekocht'}</button></div><b>${esc(d.dish||'')}</b>${d.note?`<div class="loc" style="white-space:normal">${esc(d.note)}</div>`:''}
   ${(d.uses||[]).length?`<div class="loc" style="white-space:normal;margin-top:4px">verbraucht: ${d.uses.map(esc).join(', ')}</div>`:''}${miss.length?`<div class="loc" style="white-space:normal;color:var(--warn)">fehlt: ${miss.map(esc).join(', ')} <button class="back" data-act="planShop" data-i="${i}" style="padding:0 4px">🛒 auf die Liste</button></div>`:''}</div>`;}).join('')}</div>`;}
 else h+='<div class="note">Noch kein Plan.</div>';return h;}
async function planMake(n){if(!SAMPLE)return;const its=S.items.slice().sort(byExp).slice(0,70);if(!its.length){toast('Kein Bestand zum Planen.');return;}busy('Plane die Woche…');
 const list=its.map(i=>`- ${i.name}${i.amount?' ('+amtLabel(i.amount,i.unit,i.rest)+')':''}${i.qty>1?' ×'+i.qty:''}: ${dueLabel(i.exp)}, ${KINDS[locKind(i.loc)].n}`).join('\n');
 const P=`Bestand eines deutschen Haushalts (Name, Menge, Haltbarkeit, Lagerart):\n${list}\n\nPlane ${n} einfache, alltagstaugliche Hauptgerichte für die nächsten ${n} Tage (ab heute, ${today()}). Verbrauche zuerst, was am frühesten abläuft; Gefrorenes und lange Haltbares nur, wenn es passt. Übliche Grundzutaten (Öl, Salz, Gewürze, Mehl, Zucker) gelten als vorhanden. Antworte NUR mit JSON: {"days":[{"dish": Name des Gerichts, "uses": [exakte Namen aus dem Bestand, die es verbraucht], "missing": [Zutaten, die NICHT im Bestand sind und gekauft werden müssen, kurz, mit Menge], "note": ein kurzer Satz zur Zubereitung}]} – genau ${n} Einträge.`;
 try{let v;if(typeof SAMPLE.json==='function')v=await SAMPLE.json(P,{modelTier:'default',cache:false});else{const r=await SAMPLE(P,{modelTier:'default'});const m=String(r.text||'').match(/\{[\s\S]*\}/);v=m?JSON.parse(m[0]):null;}
  const days=(v&&Array.isArray(v.days)?v.days:[]).slice(0,n).map((d,k)=>({date:addDays(k),dish:String(d.dish||'').slice(0,80),uses:(d.uses||[]).map(x=>String(x).slice(0,60)).slice(0,10),missing:(d.missing||[]).map(x=>String(x).slice(0,60)).slice(0,10),note:String(d.note||'').slice(0,200),done:false}));
  unbusy();if(!days.length){toast('Kein Plan erhalten – nochmal versuchen.');return;}
  if(await write(()=>DB.doc('plans/'+S.hh).set({days,made:new Date().toISOString(),by:ME||null})))toast('🍳 Plan erstellt');
 }catch(e){unbusy();aiErr(e);}}

/* ----- Verlauf ----- */
function viewVerlauf(){ensureStats();if(!S.purchReady||!S.logReady)return loading();resolveNames().then(ch=>{if(ch&&S.view==='verlauf')render();});
 const ev=[];S.allLog.filter(l=>hhOf(l)===S.hh).forEach(l=>ev.push({t:String(l.at||''),k:l.action,l}));
 S.allPurch.filter(x=>hhOf(x)===S.hh).forEach(x=>ev.push({t:String(x.added||x.date||''),k:'purch',p:x}));
 S.items.forEach(i=>{if(i.added&&!i.pid)ev.push({t:String(i.added),k:'add',i});});
 ev.sort((a,b)=>b.t.localeCompare(a.t));const L=ev.slice(0,100);const who=id=>id?(id===ME?'du':(S.names[id]||'jemand')):'';
 const IC={used:'✅',trash:'🗑️',remove:'↩️',purch:'🧾',add:'➕'};const TX={used:'verbraucht',trash:'weggeworfen',remove:'Fehlbuchung'};
 const dayOf=t=>t.length>10?ymd(new Date(t)):t.slice(0,10);const tm=t=>t.length>10?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
 let h=`<a class="back" href="#mehr">‹ Mehr</a><h2>🕘 Verlauf<small>letzte ${L.length} Buchungen</small></h2>`;if(!L.length)return h+'<div class="note">Noch keine Buchungen.</div>';
 let cur='';L.forEach(e=>{const d=dayOf(e.t);if(d!==cur){if(cur)h+='</div>';cur=d;h+=`<h2>${d===today()?'Heute':d===addDays(-1)?'Gestern':fmtDate(d)}</h2><div class="box">`;}
  if(e.k==='purch'){const x=e.p;h+=`<div class="ev"><span class="em">🧾</span><span class="mid"><span><b>Einkauf ${esc(x.store||'')}</b> · ${eur(pTotal(x))}</span><span class="loc">${(x.lines||[]).length} Positionen · ${esc(who(x.by))} ${tm(e.t)}</span></span><button class="back" data-act="purch" data-id="${esc(x.id)}">Details</button></div>`;}
  else if(e.k==='add'){const i=e.i;h+=`<div class="ev"><span class="em">➕</span><span class="mid"><span><b>${esc(i.name)}</b>${i.qty>1?' ×'+i.qty:''} eingeräumt</span><span class="loc">${esc(locPath(i.loc))} · ${esc(who(i.by))} ${tm(e.t)}</span></span></div>`;}
  else{const l=e.l;h+=`<div class="ev"><span class="em">${IC[e.k]||'•'}</span><span class="mid"><span><b>${esc(l.name)}</b>${l.qty>1?' ×'+l.qty:''} ${TX[e.k]||e.k}${l.val?' · '+eur(l.val):''}</span><span class="loc">${esc(who(l.by))} ${tm(e.t)}</span></span>${l.it&&e.k!=='remove'?`<button class="back" data-act="logUndo" data-id="${esc(l.id)}">↩︎ Rückgängig</button>`:''}</div>`;}});
 return h+'</div>';}
async function logUndo(id){const l=S.allLog.find(x=>x.id===id);if(!l||!l.it)return;const it=l.it;
 const item={name:l.name,cat:l.cat||'sonst',emoji:it.emoji||CATMAP[l.cat]?.e||'📦',loc:it.loc,qty:l.qty||1,exp:it.exp||today(),est:!!it.est,amount:it.amount||null,unit:it.unit||null,w:!!it.w,price:it.price??null,brand:it.brand||null,store:it.store||null,pid:it.pid||null,opened:!!it.opened,rest:it.rest??1,added:it.added||new Date().toISOString(),by:it.by||l.by||null,hh:l.hh||S.hh,no:nextNo()};
 if(l.ean)item.ean=l.ean;if(it.sub)item.sub=it.sub;
 if(!await write(()=>DB.collection('items').add(item)))return;await write(()=>DB.doc('log/'+id).delete());toast('↩︎ '+esc(l.name)+' ist wieder im Bestand');}

/* ----- Export ----- */
function csv(rows){const q=v=>{v=v==null?'':String(v).replace(/\./g,m=>m);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};const n=v=>v==null||v===''?'':String(v).replace('.',',');
 return '﻿'+rows.map(r=>r.map(c=>typeof c==='number'?n(c):q(c)).join(';')).join('\r\n');}
function exportData(kind){const hn=id=>(S.hhs.find(x=>x.id===id)||{}).name||'';
 if(kind==='bestand')return [['Haushalt','Name','Marke','Kategorie','Anzahl','Inhalt','Einheit','lose','Lagerort','MHD','MHD geschätzt','Stückpreis','Markt','eingeräumt']].concat(S.allItems.map(i=>[hn(hhOf(i)),i.name,i.brand||'',CATMAP[i.cat]?.n||'',i.qty||1,i.amount||'',i.unit||'',i.w?'ja':'',(()=>{const l=S.allLocs.find(x=>x.id===i.loc);const pp=l&&l.parent&&S.allLocs.find(x=>x.id===l.parent);return l?(pp?pp.name+' › ':'')+l.name:'';})(),i.exp||'',i.est?'ja':'',i.price??'',i.store||'',(i.added||'').slice(0,10)]));
 if(kind==='einkauf')return [['Haushalt','Datum','Markt','Bon-Summe','Artikel','Marke','Kategorie','Packungen','Inhalt','Einheit','lose','Zeilenpreis','Grundpreis €/kg bzw. €/l']].concat(S.allPurch.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).flatMap(x=>(x.lines||[]).map(l=>[hn(hhOf(x)),x.date||'',x.store||'',pTotal(x),l.name,l.brand||'',CATMAP[l.cat]?.n||'',l.qty||1,l.amount||'',l.unit||'',l.w?'ja':'',l.price??'',(()=>{const g=grundNum(l.w?l.price:(l.price||0)/(l.qty||1),l.amount,l.unit);return g?Math.round(g*100)/100:'';})()])));
 return [['Haushalt','Datum','Aktion','Name','Kategorie','Stück','Menge','Einheit','Wert €','Tage bis MHD']].concat(S.allLog.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))).map(l=>[hn(hhOf(l)),logDay(l)||'',({used:'verbraucht',trash:'weggeworfen',remove:'Fehlbuchung'})[l.action]||l.action,l.name,CATMAP[l.cat]?.n||'',l.units??l.qty,l.amount||'',l.unit||'',l.val??'',l.dl??'']));}
let DLP=null;
async function doExport(kind){const data=csv(exportData(kind));const fn='heimatinventur-'+kind+'-'+today()+'.csv';
 try{if(!DLP)DLP=claude.use('downloads');const dl=await DLP;if(dl){await dl.save({filename:fn,data});toast('⬇️ '+fn+' gespeichert');return;}}catch(e){if(e&&e.code==='declined')return;console.error(e);}
 try{await navigator.clipboard.writeText(data);toast('Download hier nicht möglich – Inhalt in die Zwischenablage kopiert.',4000);}catch(e){toast('Export in dieser Ansicht nicht möglich.');}}

/* ---------- Start ---------- */
const hhOf=x=>x.hh||(S.hhs[0]&&S.hhs[0].id)||null;
function applyHH(){const h=S.hh;S.shop=S.allShop.filter(x=>hhOf(x)===h);S.locs=S.allLocs.filter(l=>hhOf(l)===h);S.items=S.allItems.filter(i=>hhOf(i)===h);
 S.purch=S.stAll?S.allPurch:S.allPurch.filter(p=>hhOf(p)===h);S.log=S.stAll?S.allLog:S.allLog.filter(l=>hhOf(l)===h);computeFefo();}
function setHH(id){S.hh=id;try{localStorage.setItem('heimatinventur.hh',id);}catch(e){}S.draft=null;S.bon=null;S.bonMeta=null;S.lastLoc=null;S.open={};S.lagerKind=null;S.filter='all';S.sel.clear();applyHH();closeSheet();render();}
function computeFefo(){const g={};S.items.forEach(i=>{const k=ikey(i);(g[k]=g[k]||[]).push(i);});S.fefo=new Set(Object.values(g).filter(a=>a.length>1).map(a=>a.slice().sort(byExp)[0].id));}
async function resolveNames(){if(!USER||!USER.profiles)return false;const ids=[...new Set(S.items.map(i=>i.by).concat(S.allLog.map(l=>l.by),S.allPurch.map(x=>x.by)).filter(Boolean))].filter(id=>!(id in S.names)&&id!==ME);if(!ids.length)return false;
 try{const ps=await USER.profiles(ids);ids.forEach(id=>{S.names[id]=(ps&&ps[id]&&ps[id].name)||'';});}catch(e){ids.forEach(id=>{S.names[id]='';});}return true;}
function subscribe(col,onDocs,readyKey){let timer=setTimeout(()=>{if(!S[readyKey]){S.err='Daten sind gerade nicht erreichbar – bitte Verbindung prüfen.';toast(S.err,4000);}},10000);
 DB.collection(col).onSnapshot(snap=>{onDocs(snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})));if(!snap.metadata.fromCache){clearTimeout(timer);}S[readyKey]=true;renderData();},
  e=>{clearTimeout(timer);S[readyKey]=true;console.error(e);toast('Verbindung unterbrochen – Seite neu öffnen.',5000);renderData();});}
(async function init(){route();
 if(!window.claude||!window.claude.use){S.err='App konnte nicht geladen werden – bitte Internetverbindung prüfen und neu öffnen.';render();return;}
 const [db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')].map(p=>p.catch(()=>null)));
 DB=db;USER=user;
 if(!DB){S.err='Bitte anmelden.';render();return;}
 if(USER){try{ME=await USER.id();}catch(e){}try{const c=await USER.can('data.write');CANWRITE=c;if(c===false)READONLY=true;}catch(e){CANWRITE=null;}}
 subscribe('households',d=>{S.hhs=d.slice().sort(byOrder);let st=null;try{st=localStorage.getItem('heimatinventur.hh');}catch(e){}
  if(!S.hhs.find(x=>x.id===S.hh))S.hh=(S.hhs.find(x=>x.id===st)||S.hhs[0]||{}).id||null;applyHH();if(S.sheet&&S.sheet.type==='hh')renderSheet();},'hhReady');
 subscribe('locations',d=>{S.allLocs=d;applyHH();},'locsReady');
 subscribe('shopping',d=>{S.allShop=d;applyHH();},'shopReady');
 subscribe('plans',d=>{S.plans=Object.fromEntries(d.map(x=>[x.id,x]));},'planReady');
 subscribe('products',d=>{S.products=Object.fromEntries(d.map(x=>[x.id,x]));},'prodReady');
 subscribe('items',d=>{S.allItems=d;applyHH();resolveNames().then(()=>{if(S.sheet&&S.sheet.type==='item')renderSheet();});},'itemsReady');
 if(sample){SAMPLE=sample;try{const l=await sample.limits();SAMPLE_IMG=!!(l&&l.images);}catch(e){SAMPLE_IMG=false;}if(SAMPLE_IMG&&!(S.view==='neu'&&S.draft))render();}
})();
</script>
